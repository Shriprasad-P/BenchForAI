[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchforge"
version = "0.1.0"
description = "Reproducible evaluation harness for AI coding models on real repository issues."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "BenchForge" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
benchforge = "benchforge.cli.main:app"

[tool.setuptools.packages.find]
include = ["benchforge*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = ["tests/fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["benchforge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
